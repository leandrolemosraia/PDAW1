    <!-- ===== ESTRUTURA DO MODAL DEFINITIVO COM FOTO E TEXTO LADO A LADO ===== -->
    <dialog id="modal-jogo" class="janela-jogo">
        <div class="conteudo-janela">
            <!-- Botão em formato de bolinha vermelha para fechar -->
            <button id="fecharModal" class="btn-fechar">X</button>
            
            <!-- Flexbox separa a imagem e o texto nestas duas divs -->
            <div class="layout-modal">
                <div class="modal-lado-imagem">
                    <img id="modal-image" src="" alt="Capa do Jogo">
                </div>

                <div class="modal-lado-texto">
                    <h2 id="modal-title">Título</h2>
                    <p class="destaque"><strong>Nota:</strong> <span id="modal-rating"></span></p>
                    <p id="modal-description"></p>
                    <hr class="linha-divisoria">
                    <p><em>Resenha:</em> <span id="modal-review"></span></p>
                </div>
            </div>
        </div>
    </dialog>

    <!-- O Script deve ser sempre a última coisa antes de fechar o <body> -->
    <script src="script.js"></script>

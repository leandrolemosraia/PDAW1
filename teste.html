<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUC-GAMES</title>
    <style>
        /* =======================================================
           1. ESTILOS DO MODAL (Centralização absoluta da imagem)
           ======================================================= */
        dialog#meuModal {
            border: none;
            padding: 0;
            background: transparent; /* Remove a caixinha branca do fundo */
            overflow: visible;

            /* Força a imagem a ficar no centro exato da tela */
            position: fixed;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            
            max-width: 90vw;
            max-height: 90vh;
        }

        /* Fundo escuro atrás do modal */
        dialog#meuModal::backdrop {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px); 
        }

        .modal-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tamanho da imagem aberta no modal */
        .imagem-modal {
            display: block;
            max-width: 100%;
            max-height: 80vh; /* Ocupa até 80% da altura da tela */
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Botão flutuante de fechar (X) */
        .botao-fechar {
            position: absolute;
            top: -15px;
            right: -15px;
            background-color: #ff4747;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .botao-fechar:hover {
            background-color: #ff1f1f;
        }

        /* Estilos visuais dos cards na sua página */
        .card-jogo {
            cursor: pointer;
            display: inline-block;
            margin: 10px;
            transition: transform 0.2s;
        }
        .card-jogo:hover {
            transform: scale(1.03);
        }
        .layout-container {
            display: flex;
        }
        .conteudo-principal {
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="layout-container">
        <aside class="sidebar">
            <div class="logo-container">
                 <img src="imagensJOGOS/PUCGAMES.png" alt="Logo PUC Games" class="logo-img">

                <ul>
                    <li><a href="#">Início</a></li>

                    <li><a href="#">Ação</a></li>
                    <li><a href="#">Multiplayer</a></li>
                </ul>
            </nav>
        </aside>    

        <main class="conteudo-principal">
            
            <!-- LISTA DE JOGOS (O JS vai ler a imagem que está aqui dentro automaticamente) -->
            <div class="card-jogo">
                <img class="molduraJOGO" src="imagensJOGOS/PokemonFireRed.jpg" alt="Pokemon FireRed" height="210" width="165">
            </div>
                
            <div class="card-jogo">
                <img class="molduraJOGO" src="imagensJOGOS/Assassins_Creed_shadows.jpg" alt="Assassin's Creed Shadows" height="210" width="165">
            </div>

            <div class="card-jogo">
                <img class="molduraJOGO" src="imagensJOGOS/Elden_Ring.jpg" alt="Elden Ring" height="210" width="165">
            </div>

            <div class="card-jogo">
                <img class="molduraJOGO" src="imagensJOGOS/RDR2.jpg" alt="Red Dead Redemption 2" height="210" width="165">
            </div>
            
            <div class="card-jogo">
                <img class="molduraJOGO" src="imagensJOGOS/Monster_Hunter_Wilds.png" alt="Monster Hunter Wilds" height="210" width="165">
            </div>
            
            <div class="card-jogo"> 
                <img class="molduraJOGO" src="imagensJOGOS/CS2.jpg" alt="Counter-Strike 2" height="210" width="165">
            </div>
           
            <div class="card-jogo">
                <img class="molduraJOGO" src="imagensJOGOS/Project_Zomboid.jpg" alt="Project Zomboid" height="210" width="165">
            </div>
           
            <div class="card-jogo">
                <img class="molduraJOGO" src="imagensJOGOS/Terraria.png" alt="Terraria" height="210" width="165">
            </div>

            <div class="card-jogo">
                <img class="molduraJOGO" src="imagensJOGOS/Need_for_Speed_Heat.png" alt="Need for Speed Heat" height="210" width="165">
            </div>
            
            <div class="card-jogo">
                <img class="molduraJOGO" src="imagensJOGOS/Grand_Theft_Auto_V.png" alt="Grand Theft Auto V" height="210" width="165">
            </div>
            
            <div class="card-jogo">
                <img class="molduraJOGO" src="imagensJOGOS/Forza_Horizon_6.jpg" alt="Forza Horizon 6" height="210" width="165">
            </div>
            
            <div class="card-jogo">
                <img class="molduraJOGO" src="imagensJOGOS/Devil_May_Cry_5.jpg" alt="Devil May Cry 5" height="210" width="165">
            </div>
           
            <div class="card-jogo">

        </main>
    </div>

    <!-- ESTRUTURA APENAS COM A IMAGEM -->
    <dialog id="meuModal">
      <div class="modal-container">
        <button class="botao-fechar" id="fecharModal">&times;</button>
        <img id="modal-image" src="" alt="" class="imagem-modal">
      </div>
    </dialog>

    <!-- 2. JAVASCRIPT DE CLIQUE SIMPLES -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const modal = document.getElementById('meuModal');
            const botaoFechar = document.getElementById('fecharModal');
            const modalImage = document.getElementById('modal-image');

            // Seleciona todos os seus cards de jogos
            const cards = document.querySelectorAll('.card-jogo');

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Encontra a imagem que está dentro do card que foi clicado
                    const imagemDoCard = card.querySelector('img');
                    
                    if (imagemDoCard) {
                        // Copia o caminho da imagem do card para a imagem do modal
                        modalImage.src = imagemDoCard.src;
                        modalImage.alt = imagemDoCard.alt;

                        // Abre o modal centralizado
                        modal.showModal();
                    }
                });
            });

            // Fecha no botão X
            botaoFechar.addEventListener('click', () => {
                modal.close();
            });

            // Fecha ao clicar fora da imagem
            modal.addEventListener('click', (evento) => {
                const r = modal.getBoundingClientRect();
                if (
                    evento.clientX < r.left ||
                    evento.clientX > r.right ||
                    evento.clientY < r.top ||
                    evento.clientY > r.bottom
                ) {
                    modal.close();
                }
            });
        });
    </script>
</body>
</html>
